services:
  notismart-backend:
    container_name: notismart-backend-dev
    build:
      context: .
      dockerfile: Dockerfile-dev
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"
    volumes:
      #- ./mvn:/opt/app/.mvn
      - ./:/opt/app/
      - ~/.m2/repository:/root/.m2/repository
    environment:
      - DB_USERNAME=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - EMAIL_KEY=${EMAIL_KEY}
      - DB_HOST=notismart-db
    depends_on:
      notismart-db:
        condition: service_healthy
  notismart-db:
    image: postgres:17
    container_name: notismart-db-dev
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./db:/docker-entrypoint-initdb.d/
      - notismart_db:/var/lib/postgresql/data
volumes:
  notismart_db: